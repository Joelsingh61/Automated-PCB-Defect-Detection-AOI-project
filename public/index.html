<!DOCTYPE html>
<html>
<head>

    <title>PCB Defect Inspection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .upload {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #preview {
            max-width: 800px;
            margin-top: 20px;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 12px;
        }

        .pass {
            color: green;
            font-size: 28px;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-size: 28px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

    </style>

</head>

<body>

<h1>🔍 Automated PCB Defect Inspection</h1>

<div class="upload">

    <h3>Upload PCB Image</h3>

    <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg"
    >

    <br>

    <button onclick="inspectPCB()">
        Inspect PCB
    </button>

    <br>

    <img id="preview">

</div>


<div id="result" class="result" style="display:none;">

    <h2>Inspection Result</h2>

    <div id="status"></div>

    <p id="count"></p>

    <table>

        <thead>
            <tr>
                <th>Defect</th>
                <th>Confidence</th>
            </tr>
        </thead>

        <tbody id="detections"></tbody>

    </table>

</div>


<script>

async function inspectPCB() {

    const input =
        document.getElementById("imageInput");

    if (!input.files.length) {
        alert("Please upload a PCB image.");
        return;
    }

    const file = input.files[0];

    const reader = new FileReader();

    reader.onload = async function(event) {

        document.getElementById("preview").src =
            event.target.result;

        document.getElementById("result").style.display =
            "block";

        document.getElementById("status").innerText =
            "⏳ Inspecting...";

        const response = await fetch(
            "/api/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: event.target.result
                })
            }
        );

        const data = await response.json();

        if (data.error) {

            document.getElementById("status")
                .innerText =
                "Error: " + data.error;

            return;
        }

        const status =
            document.getElementById("status");

        if (data.status === "PASS") {

            status.innerHTML =
                '<div class="pass">✅ PCB PASS</div>';

        } else {

            status.innerHTML =
                '<div class="fail">❌ PCB FAIL</div>';
        }

        document.getElementById("count")
            .innerText =
            "Total defects detected: "
            + data.total_defects;

        const tbody =
            document.getElementById("detections");

        tbody.innerHTML = "";

        data.detections.forEach(item => {

            const row =
                document.createElement("tr");

            row.innerHTML =
                `<td>${item.defect}</td>
                 <td>${item.confidence}%</td>`;

            tbody.appendChild(row);

        });

    };

    reader.readAsDataURL(file);
}

</script>

</body>
</html>
